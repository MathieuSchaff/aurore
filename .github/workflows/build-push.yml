name: build-push

# Build api + frontend once on merge to main, push to GHCR. The VPS then pulls
# these pre-built images instead of building on-server. Separate from ci.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: mathieuschaff # GHCR requires lowercase owner

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: infra/docker/images/backend/Dockerfile
            target: prod
          - name: frontend
            dockerfile: infra/docker/images/frontend/Dockerfile
            target: "" # empty = last stage (nginx serving the Vite build)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # auto-injected, no setup

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          # VITE_* baked into the frontend build (ignored by the api image). Faro
          # collector URL comes from a repo secret; empty secret = telemetry off.
          build-args: |
            VITE_FARO_URL=${{ secrets.VITE_FARO_URL }}
            VITE_APP_VERSION=${{ github.sha }}
            VITE_API_URL=http://api:3000
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/aurore-${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/aurore-${{ matrix.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
